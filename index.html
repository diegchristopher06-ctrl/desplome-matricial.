<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Desplome Matricial 3x3</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; padding: 20px; color: #333; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #b71c1c; } /* Rojo UES */
        label { display: block; margin-top: 10px; font-weight: bold; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background-color: #b71c1c; color: white; border: none; border-radius: 5px; margin-top: 20px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #7f0000; }
        .result { margin-top: 20px; padding: 15px; background-color: #fff3e0; border-left: 5px solid #b71c1c; }
    </style>
</head>
<body>

<div class="container">
    <h2>Ingeniería UES</h2>
    <p style="font-size: 0.9em; text-align: center; color: #666;">Verificación de Verticalidad 3x3</p>
    
    <label>Altura de la pared (m):</label>
    <input type="number" id="altura" placeholder="Ej: 3.5" step="0.01">

    <label>Ángulo X (Roll):</label>
    <input type="number" id="angX" placeholder="Grados en X" step="0.1">

    <label>Ángulo Y (Pitch):</label>
    <input type="number" id="angY" placeholder="Grados en Y" step="0.1">

    <label>Ángulo Z (Yaw/Azimut):</label>
    <input type="number" id="angZ" value="0" step="0.1">

    <button onclick="calcular()">CALCULAR DESPLOME</button>

    <div id="resultado" class="result" style="display:none;">
        <strong>Resultados del cálculo:</strong>
        <p id="desplomeTexto"></p>
    </div>
</div>

<script>
    function calcular() {
        const H = parseFloat(document.getElementById('altura').value);
        const xDeg = parseFloat(document.getElementById('angX').value);
        const yDeg = parseFloat(document.getElementById('angY').value);
        
        if (isNaN(H) || isNaN(xDeg) || isNaN(yDeg)) {
            alert("Por favor, ingresa los datos necesarios.");
            return;
        }

        const rad = Math.PI / 180;
        // Cálculo basado en proyecciones de la matriz de rotación
        let desplomeX = H * Math.sin(yDeg * rad);
        let desplomeY = H * Math.sin(xDeg * rad);
        let desplomeTotal = Math.sqrt(Math.pow(desplomeX, 2) + Math.pow(desplomeY, 2));

        document.getElementById('resultado').style.display = "block";
        document.getElementById('desplomeTexto').innerHTML = 
            `Desplome en X: ${(desplomeX * 100).toFixed(2)} cm<br>` +
            `Desplome en Y: ${(desplomeY * 100).toFixed(2)} cm<br>` +
            `<strong>Desplome Total: ${(desplomeTotal * 100).toFixed(2)} cm</strong>`;
    }
</script>

</body>
</html>
