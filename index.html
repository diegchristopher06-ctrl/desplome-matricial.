<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Desplome - Ingeniería Civil</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f8f9fa; padding: 20px; color: #212529; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .container { max-width: 450px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); border-top: 6px solid #b71c1c; }
        .header { text-align: center; margin-bottom: 20px; }
        
        /* Estilo para el escudo oficial UES detallado */
        .logo-ues { width: 100px; height: auto; margin-bottom: 15px; }
        
        h2 { color: #b71c1c; margin: 0; font-size: 1.5em; letter-spacing: 0.5px; text-transform: uppercase; }
        .sub-header { color: #6c757d; font-size: 0.85em; margin-top: 5px; font-weight: bold; }
        
        label { display: block; margin-top: 18px; font-weight: 600; font-size: 0.85em; color: #495057; }
        input { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; font-size: 1em; }
        input:focus { border-color: #b71c1c; outline: none; background-color: #fff8f8; }
        
        button { width: 100%; padding: 15px; background-color: #b71c1c; color: white; border: none; border-radius: 6px; margin-top: 25px; font-size: 15px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(183, 28, 28, 0.2); transition: 0.3s; }
        button:hover { background-color: #8e1616; transform: translateY(-1px); }
        
        .result { margin-top: 25px; padding: 15px; background-color: #fdf2f2; border: 1px solid #f5c6cb; border-radius: 6px; }
        
        .authors-box { margin-top: 40px; padding-top: 15px; border-top: 1px solid #eee; text-align: center; }
        .authors-title { font-size: 0.7em; color: #b71c1c; font-weight: bold; letter-spacing: 2px; margin-bottom: 8px; }
        .names { font-size: 0.85em; color: #495057; font-style: italic; line-height: 1.6; }
        .faculty { font-size: 0.7em; color: #adb5bd; margin-top: 8px; font-weight: bold; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <!-- Escudo Detallado de la UES -->
        <svg class="logo-ues" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="48" fill="none" stroke="#b71c1c" stroke-width="2"/>
            <circle cx="50" cy="50" r="42" fill="none" stroke="#b71c1c" stroke-width="1"/>
            <path d="M50 20 L55 35 L70 35 L58 45 L62 60 L50 50 L38 60 L42 45 L30 35 L45 35 Z" fill="#b71c1c"/>
            <path d="M50 15 A35 35 0 0 1 85 50 M15 50 A35 35 0 0 1 50 15" fill="none" stroke="#b71c1c" stroke-width="3" stroke-linecap="round"/>
            <text x="50" y="85" font-family="Arial" font-size="8" text-anchor="middle" fill="#b71c1c" font-weight="bold">UES</text>
        </svg>
        <h2>Ingeniería Civil</h2>
        <div class="sub-header">Proyecto de: Álgebra Vectorial y Lineal (2026)</div>
    </div>
    
    <label>Altura de la Estructura (m):</label>
    <input type="number" id="altura" placeholder="Ej: 3.50" step="0.01">

    <label>Ángulo en Eje X (Grados):</label>
    <input type="number" id="angX" placeholder="0.0" step="0.1">

    <label>Ángulo en Eje Y (Grados):</label>
    <input type="number" id="angY" placeholder="0.0" step="0.1">

    <button onclick="calcular()">CALCULAR DESPLOME MATRICIAL</button>

    <div id="resultado" class="result" style="display:none;">
        <strong style="font-size: 0.9em;">REPORTE TÉCNICO - GRUPO 6:</strong>
        <p id="desplomeTexto" style="margin: 10px 0 0 0; font-size: 1em;"></p>
    </div>

    <div class="authors-box">
        <div class="authors-title">DESARROLLADO POR:</div>
        <div class="names">
            Hernández, Christopher — López, María — Figueroa, Daniela
        </div>
        <div class="faculty">
            FACULTAD MULTIDISCIPLINARIA DE OCCIDENTE<br>
            UNIVERSIDAD DE EL SALVADOR © 2026
        </div>
    </div>
</div>

<script>
    function calcular() {
        const H = parseFloat(document.getElementById('altura').value);
        const xDeg = parseFloat(document.getElementById('angX').value);
        const yDeg = parseFloat(document.getElementById('angY').value);
        
        if (isNaN(H) || isNaN(xDeg) || isNaN(yDeg)) {
            alert("Error: Por favor complete todos los datos de medición.");
            return;
        }

        const rad = Math.PI / 180;
        let desplomeX = H * Math.sin(yDeg * rad);
        let desplomeY = H * Math.sin(xDeg * rad);
        let desplomeTotal = Math.sqrt(Math.pow(desplomeX, 2) + Math.pow(desplomeY, 2));

        document.getElementById('resultado').style.display = "block";
        document.getElementById('desplomeTexto').innerHTML = 
            `Desplome Eje X: <b>${(desplomeX * 100).toFixed(2)} cm</b><br>` +
            `Desplome Eje Y: <b>${(desplomeY * 100).toFixed(2)} cm</b><br>` +
            `<hr style="border:0; border-top:1px solid #f5c6cb; margin:10px 0;">` +
            `<span style="font-size: 1.1em; color: #b71c1c;"><b>Desplome Total: ${(desplomeTotal * 100).toFixed(2)} cm</b></span>`;
    }
</script>

</body>
</html>
