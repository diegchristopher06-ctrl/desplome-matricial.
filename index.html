<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Desplome - Ingeniería Civil</title>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background-color: #f8f9fa;
    padding: 20px;
    color: #212529;
}

.container {
    max-width: 450px;
    margin: auto;
    background: white;
    padding: 40px 30px;
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    border-top: 8px solid #b71c1c;
}

h2 {
    color: #b71c1c;
    text-align: center;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

input, select {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 20px;
    background-color: #b71c1c;
    color: white;
    border: none;
    cursor: pointer;
}

.result {
    margin-top: 20px;
    padding: 15px;
    background: #fdf2f2;
    border: 1px solid #f5c6cb;
    border-radius: 6px;
}
</style>
</head>

<body>

<div class="container">

<h2>Calculadora de Desplome</h2>

<label>Altura (m):</label>
<input type="number" id="altura">

<label>Ángulo X (°):</label>
<input type="number" id="angX">

<label>Ángulo Y (°):</label>
<input type="number" id="angY">

<label>Ángulo Z (°):</label>
<input type="number" id="angZ">

<label>Sentido Z:</label>
<select id="sentidoZ">
<option value="N">N</option>
<option value="S">S</option>
<option value="E">E</option>
<option value="O">O</option>
</select>

<button onclick="calcular()">Calcular</button>

<div id="resultado" class="result" style="display:none;">
<p id="desplomeTexto"></p>
</div>

</div>

<script>
function calcular() {

    const H_m = parseFloat(document.getElementById('altura').value);
    const xDeg = parseFloat(document.getElementById('angX').value);
    const yDeg = parseFloat(document.getElementById('angY').value);
    const zDeg = parseFloat(document.getElementById('angZ').value);
    const sentido = document.getElementById('sentidoZ').value;

    if (isNaN(H_m) || isNaN(xDeg) || isNaN(yDeg) || isNaN(zDeg)) {
        alert("Ingrese todos los datos");
        return;
    }

    const H_cm = H_m * 100;

    const rad = Math.PI / 180;
    const theta = xDeg * rad;
    const phi = yDeg * rad;
    const psi = zDeg * rad;

    // 🔥 CORRECCIÓN PRINCIPAL
    let x_inc = H_cm * Math.tan(phi);
    let y_inc = H_cm * Math.tan(theta);

    // Rotación Z
    let cosZ = Math.cos(psi);
    let sinZ = Math.sin(psi);

    let x_final = (x_inc * cosZ) - (y_inc * sinZ);
    let y_final = (x_inc * sinZ) + (y_inc * cosZ);

    let total = Math.sqrt(x_final*x_final + y_final*y_final);

    document.getElementById('resultado').style.display = "block";

    document.getElementById('desplomeTexto').innerHTML =
        "Desplome X: " + x_final.toFixed(2) + " cm<br>" +
        "Desplome Y: " + y_final.toFixed(2) + " cm<br>" +
        "Total: " + total.toFixed(2) + " cm";
}
</script>

</body>
</html>
