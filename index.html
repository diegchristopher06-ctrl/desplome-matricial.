<script>
function calcular() {
    const H_m = parseFloat(document.getElementById('altura').value);
    const xDeg = parseFloat(document.getElementById('angX').value);
    const yDeg = parseFloat(document.getElementById('angY').value);
    const zDeg = parseFloat(document.getElementById('angZ').value);

    if (isNaN(H_m) || isNaN(xDeg) || isNaN(yDeg) || isNaN(zDeg)) {
        alert("Por favor, ingrese todos los valores.");
        return;
    }

    // Convertir altura a cm
    const H_cm = H_m * 100;

    // Conversión a radianes
    const rad = Math.PI / 180;
    const theta = xDeg * rad; // X
    const phi = yDeg * rad;   // Y
    const psi = zDeg * rad;   // Z

    // ✅ CORRECCIÓN: usar TAN en lugar de SIN
    let x_inc = H_cm * Math.tan(phi);
    let y_inc = H_cm * Math.tan(theta);

    // Rotación en Z (orientación real)
    let cosZ = Math.cos(psi);
    let sinZ = Math.sin(psi);

    let desplomeX_cm = (x_inc * cosZ) - (y_inc * sinZ);
    let desplomeY_cm = (x_inc * sinZ) + (y_inc * cosZ);

    // Magnitud total
    let desplomeTotal_cm = Math.sqrt(
        Math.pow(desplomeX_cm, 2) + Math.pow(desplomeY_cm, 2)
    );

    // Mostrar resultados
    const resDiv = document.getElementById('resultado');
    resDiv.style.display = "block";

    document.getElementById('desplomeTexto').innerHTML =
        `Desplome en X: <b>${desplomeX_cm.toFixed(2)} cm</b><br>` +
        `Desplome en Y: <b>${desplomeY_cm.toFixed(2)} cm</b><br>` +
        `Orientación Z: <b>${zDeg.toFixed(1)}° ${sentido}</b><br>` +
        `<hr style="border:0; border-top:1px solid #f5c6cb; margin:10px 0;">` +
        `<span style="color:#b71c1c;"><b>Desplome Total: ${desplomeTotal_cm.toFixed(2)} cm</b></span>`;
}
</script>
